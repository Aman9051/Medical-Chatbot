<!DOCTYPE html>
<html>
<head>
    <title>Medical Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Medical Chatbot</h1>

    <form method="POST">
        <input name="question" placeholder="Ask medical question..." required>
        <button type="submit">Ask</button>
    </form>

    {% if question %}
        <div class="box">
            <h3>Question</h3>
            <p>{{ question }}</p>
        </div>
    {% endif %}

    {% if answer %}
        <div class="box answer">
            <h3>Answer</h3>
            <p>{{ answer }}</p>
        </div>
    {% endif %}

</div>

</body>
</html>
